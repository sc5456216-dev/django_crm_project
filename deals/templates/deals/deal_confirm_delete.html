{% extends 'base.html' %}

{% block title %}Delete Deal - CRM{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card shadow-sm border-danger">
            <div class="card-header bg-danger text-white"><h4 class="mb-0"><i class="fas fa-exclamation-triangle"></i> Confirm Delete</h4></div>
            <div class="card-body text-center">
                <p class="fs-5">Delete deal <strong>{{ deal.title }}</strong>?</p>
                <p class="text-muted">This cannot be undone.</p>
                <form method="post">
                    {% csrf_token %}
                    <a href="{% url 'deal_list' %}" class="btn btn-secondary">Cancel</a>
                    <button type="submit" class="btn btn-danger"><i class="fas fa-trash"></i> Yes, Delete</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
